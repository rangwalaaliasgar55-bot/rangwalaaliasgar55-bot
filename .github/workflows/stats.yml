name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # palette matches assets/*.svg — see web/src/data/theme.ts
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=rangwalaaliasgar55-bot&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&border_radius=18&bg_color=0B1022&title_color=00E5FF&text_color=8EA0C9&icon_color=FF006E&ring_color=00E5FF
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=rangwalaaliasgar55-bot&layout=compact&langs_count=8&hide_border=true&border_radius=18&bg_color=0B1022&title_color=00E5FF&text_color=8EA0C9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: refresh README cards" || exit 0
          git push
