name: Rebuild README artwork

on:
  push:
    branches: [main]
    paths:
      - "web/src/data/**"
      - "web/scripts/**"
      - ".github/workflows/readme-art.yml"
  workflow_dispatch:

jobs:
  art:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Render animated SVGs from the React components
        run: npm run assets

      - name: Commit artwork
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: rebuild README artwork" || exit 0
          git push
